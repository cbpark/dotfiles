# use zsh
set-option -g default-shell "/bin/zsh"

# color setting
set -g default-terminal "tmux-256color"

# key binding prefix
unbind C-b
set -g prefix C-o
bind-key C-o last-window

# start numbering from 1
set -g base-index 1

# allows for faster key repetition
set -s escape-time 0

# aggressive Resize
setw -g aggressive-resize on

# activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# Vi key binding
set-option -g status-keys vi
set-option -gw mode-keys vi

# X clipboard integration
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xsel -i -p && xsel -o -p | xsel -i -b"

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# auto window rename
set-window-option -g automatic-rename

# set scrollback
set -g history-limit 100000

# window title string (set-titles must be "on" for set-titles-string to take effect)
set -g set-titles on
set -g set-titles-string '#T'

# ssh
bind-key S   command-prompt -p "host" "split-window 'ssh %1'"
bind-key C-s command-prompt -p "host" "new-window -n %1 'ssh %1'"

# man
bind-key C-m command-prompt -p "man" "split-window 'exec man %%'"

# fix for cursor color
# set -ag terminal-overrides ',screen*:cvvis=\E[34l\E[?25h'

# activities (kept as the single source of truth; earlier "on" settings removed to avoid conflict)
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# modes
setw -g clock-mode-colour green

#### COLOUR (Solarized) ####

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-interval 2
# for dark
# set -g status-style fg=yellow,bg=black         # yellow on base02
# for light
set -g status-style fg=yellow,bg=white         # base02 on base3
set -g status-left ''
set -g status-left-length 20
# for dark
# set -g status-right '#[fg=colour230,bg=colour238,bold] %m/%d #[fg=colour230,bg=colour238,bold] %H:%M '
# for light
set -g status-right '#[fg=colour233,bg=colour245,bold] %m/%d #[fg=colour233,bg=colour245,bold] %H:%M '
set -g status-right-length 50

# window status (default / current) — single definition, no duplicates
# for dark
# setw -g window-status-style fg=brightblue,bg=default   # base0
# for light
setw -g window-status-style fg=brightyellow,bg=default
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

setw -g window-status-current-style fg=brightred,bg=default
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

# pane border
# for dark
# set-option -g pane-border-style fg=black               # base02
# set-option -g pane-active-border-style fg=brightgreen  # base01
# for light
set-option -g pane-border-style fg=white
set-option -g pane-active-border-style fg=brightcyan

# message text
# for dark
# set-option -g message-style fg=brightred,bg=black
# for light
set-option -g message-style fg=brightred,bg=white

# pane number display
set-option -g display-panes-active-colour blue
set-option -g display-panes-colour brightred

# bell
set-window-option -g window-status-bell-style fg=white,bg=red