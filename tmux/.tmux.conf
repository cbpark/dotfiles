# use zsh
set-option -g default-shell "/bin/zsh"

# color setting
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# key binding prefix
unbind C-b
set -g prefix C-o
bind-key C-o last-window

# start numbering from 1
set -g base-index 1

# allows for faster key repetition
set -s escape-time 0

# aggressive Resize
setw -g aggressive-resize on

# activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# Vi key binding
set-option -g status-keys vi
set-option -gw mode-keys vi

# X clipboard integration
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xsel -i -p && xsel -o -p | xsel -i -b"

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# auto window rename
set-window-option -g automatic-rename

# set scrollback
set -g history-limit 100000

# window title string (set-titles must be "on" for set-titles-string to take effect)
set -g set-titles on
set -g set-titles-string '#T'

# ssh
bind-key S   command-prompt -p "host" "split-window 'ssh %1'"
bind-key C-s command-prompt -p "host" "new-window -n %1 'ssh %1'"

# man
bind-key C-m command-prompt -p "man" "split-window 'exec man %%'"

# fix for cursor color
# set -ag terminal-overrides ',screen*:cvvis=\E[34l\E[?25h'

# activities (kept as the single source of truth; earlier "on" settings removed to avoid conflict)
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# modes
setw -g clock-mode-colour "#88c0d0"

#### COLOUR (Nord) ####

# Nord palette reference:
# nord0  #2e3440  background (darkest)
# nord1  #3b4252  background (dark)
# nord2  #434c5e  background (light)
# nord3  #4c566a  comments / inactive
# nord4  #d8dee9  foreground (dark)
# nord5  #e5e9f0  foreground
# nord6  #eceff4  foreground (brightest)
# nord7  #8fbcbb  teal (frost)
# nord8  #88c0d0  light blue (frost)
# nord9  #81a1c1  blue (frost)
# nord10 #5e81ac  dark blue (frost)
# nord11 #bf616a  red
# nord12 #d08770  orange
# nord13 #ebcb8b  yellow
# nord14 #a3be8c  green
# nord15 #b48ead  purple

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-interval 2
set -g status-style fg="#d8dee9",bg="#2e3440"

set -g status-left ''
set -g status-left-length 20

set -g status-right '#[fg=#2e3440,bg=#88c0d0,bold] %m/%d #[fg=#2e3440,bg=#81a1c1,bold] %H:%M '
set -g status-right-length 50

# window status (default / current)
setw -g window-status-style fg="#4c566a",bg=default
setw -g window-status-format ' #I#[fg=#434c5e]:#[fg=#d8dee9]#W#[fg=#4c566a]#F '

setw -g window-status-current-style fg="#eceff4",bg=default
setw -g window-status-current-format ' #I#[fg=#88c0d0]:#[fg=#eceff4,bold]#W#[fg=#8fbcbb]#F '

# pane border
set-option -g pane-border-style fg="#4c566a"
set-option -g pane-active-border-style fg="#88c0d0"

# message text
set-option -g message-style fg="#eceff4",bg="#3b4252"
set-option -g message-command-style fg="#eceff4",bg="#3b4252"

# pane number display
set-option -g display-panes-active-colour "#88c0d0"
set-option -g display-panes-colour "#bf616a"

# bell
set-window-option -g window-status-bell-style fg="#2e3440",bg="#bf616a"
